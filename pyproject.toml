[project]
name = "backend-manufacturing-erp-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "erfiaaans", email = "erfianadia05@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.17",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
backend-manufacturing-erp-django = "backend_manufacturing_erp_django:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]
